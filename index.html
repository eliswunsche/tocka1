<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Roztoč kolo štěstí 💕</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #ffe6ee;
    text-align: center;
    margin: 0;
    overflow-x: hidden;
  }

  h1 { margin-top: 20px; }

  .wheel-container {
    position: relative;
    width: 300px;
    height: 300px;
    margin: 40px auto;
  }

  .pointer {
    width: 0;
    height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 30px solid #ff4d6d;
    position: absolute;
    top: -15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
  }

  svg {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 8px solid #ff4d6d;
    background: white;
    transition: transform 6s cubic-bezier(0.15, 0.85, 0.25, 1);
  }

  button {
    margin-top: 20px;
    padding: 12px 25px;
    font-size: 18px;
    background: #ff4d6d;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  .winner-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
    flex-direction: column;
    color: white;
    font-size: 24px;
    text-align: center;
    display: none;
  }

  .confetti {
    position: absolute;
    width: 8px;
    height: 8px;
    background: yellow;
    top: 0;
    left: 50%;
    animation: drop 2s linear forwards;
  }

  @keyframes drop {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(300px) rotate(360deg); }
  }
</style>
</head>
<body>

<h1>Roztoč kolo štěstí 💘</h1>

<div class="wheel-container">
  <div class="pointer"></div>
  <svg id="wheel" viewBox="0 0 200 200"></svg>
</div>

<button onclick="spin()">Roztočit 💫</button>

<div id="winner" class="winner-overlay">
  <div id="winner-text">Vyhrál jsi Penízky na benzín! 💰</div>
</div>

<script>
const labels = ["Masáž","Večeře","Striptýz","Penízky na benzín","Anál","Překvapení"];
const colors = ["#FFD1DC","#FFB3C6","#FFA6C9","#FF8FAB","#FF6F8F","#FFC6E0"];
const wheel = document.getElementById("wheel");
const center = 100;
const radius = 100;
const sliceAngle = 360 / labels.length;

// Vykreslení segmentů
labels.forEach((text, i) => {
  const start = i * sliceAngle;
  const end = start + sliceAngle;

  const x1 = center + radius * Math.cos((Math.PI/180)*(start-90));
  const y1 = center + radius * Math.sin((Math.PI/180)*(start-90));
  const x2 = center + radius * Math.cos((Math.PI/180)*(end-90));
  const y2 = center + radius * Math.sin((Math.PI/180)*(end-90));

  const path = document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d",`M ${center} ${center} L ${x1} ${y1} A ${radius} ${radius} 0 0 1 ${x2} ${y2} Z`);
  path.setAttribute("fill", colors[i]);
  wheel.appendChild(path);

  const label = document.createElementNS("http://www.w3.org/2000/svg","text");
  label.setAttribute("x", center);
  label.setAttribute("y", center-60);
  label.setAttribute("text-anchor","middle");
  label.setAttribute("transform",`rotate(${start + sliceAngle/2} ${center} ${center})`);
  label.style.fontSize="10px";

  if(text==="Penízky na benzín"){
    const t1 = document.createElementNS("http://www.w3.org/2000/svg","tspan");
    t1.setAttribute("x", center);
    t1.setAttribute("dy", "0");
    t1.textContent="Penízky na";
    const t2 = document.createElementNS("http://www.w3.org/2000/svg","tspan");
    t2.setAttribute("x", center);
    t2.setAttribute("dy", "12");
    t2.textContent="benzín";
    label.appendChild(t1);
    label.appendChild(t2);
  } else {
    label.textContent = text;
  }
  wheel.appendChild(label);
});

function spin() {
  const targetIndex = 3; // Penízky na benzín
  const rotations = 5*360; // plných otoček
  const offsetPixels = 1.5; // jemný posun na začátek segmentu
  const offsetDegrees = (offsetPixels/radius)*(180/Math.PI);

  // správný výpočet úhlu pro přesné zastavení segmentu
  const targetAngle = rotations + 360 - (targetIndex * sliceAngle) + offsetDegrees;

  wheel.style.transform = `rotate(${targetAngle}deg)`;

  setTimeout(showWinner, 6000);
}

function showWinner(){
  const overlay = document.getElementById("winner");
  overlay.style.display="flex";

  for(let i=0;i<50;i++){
    const confetti = document.createElement("div");
    confetti.className="confetti";
    confetti.style.left = Math.random()*window.innerWidth + "px";
    confetti.style.background = `hsl(${Math.random()*10+0},100%,70%)`; // jemně červené konfety
    confetti.style.animationDuration=(2+Math.random()*2)+"s";
    document.body.appendChild(confetti);
    setTimeout(()=>confetti.remove(),4000);
  }
}
</script>

</body>
</html>
