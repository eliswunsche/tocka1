<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Roztoč kolo štěstí 💕</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  background: #ffe6ee;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

h1 {
  margin-bottom: 12px;
  font-size: 1.4rem;
  text-align: center;
}

.wheel-wrapper {
  position: relative;
  width: min(90vw, 360px);
  aspect-ratio: 1 / 1;
}

.pointer {
  position: absolute;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-top: 22px solid #ff4d6d;
  z-index: 10;
}

svg {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 8px solid #ff4d6d;
  background: white;
  transition: transform 6s cubic-bezier(0.12, 0.9, 0.25, 1);
}

svg text {
  font-size: 12px;
  fill: #000;
}

button {
  margin-top: 18px;
  padding: 14px 28px;
  font-size: 1.1rem;
  background: #ff4d6d;
  color: white;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

.winner-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  display: none;
  justify-content: center;
  align-items: center;
  color: white;
  font-size: 1.6rem;
  text-align: center;
  z-index: 100;
}
</style>
</head>

<body>

<h1>Roztoč kolo štěstí 💘</h1>

<div class="wheel-wrapper">
  <div class="pointer"></div>
  <svg id="wheel" viewBox="0 0 200 200"></svg>
</div>

<button onclick="spin()">Roztočit 💫</button>

<div id="winner" class="winner-overlay">
  💰 Penízky na benzín!
</div>

<script>
const labels = [
  "Masáž",
  "Večeře",
  "Striptýz",
  "Penízky na benzín",
  "Anál",
  "Překvapení"
];

const colors = [
  "#FFD1DC",
  "#FFB3C6",
  "#FFA6C9",
  "#FF8FAB",
  "#FF6B7D",
  "#FFC6E0"
];

const wheel = document.getElementById("wheel");
const center = 100;
const radius = 100;
const slice = 360 / labels.length;

labels.forEach((text, i) => {
  const start = i * slice;
  const end = start + slice;

  const x1 = center + radius * Math.cos((Math.PI/180)*(start-90));
  const y1 = center + radius * Math.sin((Math.PI/180)*(start-90));
  const x2 = center + radius * Math.cos((Math.PI/180)*(end-90));
  const y2 = center + radius * Math.sin((Math.PI/180)*(end-90));

  const path = document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d",`M ${center} ${center} L ${x1} ${y1} A ${radius} ${radius} 0 0 1 ${x2} ${y2} Z`);
  path.setAttribute("fill", colors[i]);
  wheel.appendChild(path);

  const label = document.createElementNS("http://www.w3.org/2000/svg","text");
  label.setAttribute("text-anchor","middle");
  label.setAttribute("x", center);
  label.setAttribute("y", center - 62);
  label.setAttribute("transform",`rotate(${start + slice/2} ${center} ${center})`);

  if (text === "Penízky na benzín") {
    const t1 = document.createElementNS("http://www.w3.org/2000/svg","tspan");
    t1.setAttribute("x", center);
    t1.textContent = "Penízky na";
    const t2 = document.createElementNS("http://www.w3.org/2000/svg","tspan");
    t2.setAttribute("x", center);
    t2.setAttribute("dy", 14);
    t2.textContent = "benzín";
    label.appendChild(t1);
    label.appendChild(t2);
  } else {
    label.textContent = text;
  }

  wheel.appendChild(label);
});

function spin() {
  const targetIndex = 3; // Penízky
  const fakeIndex = 4;   // Anál

  const rotations = 5 * 360;
  const fakeAngle = fakeIndex * slice;
  const fineOffset = -slice/2 + 4; // prvních pár px segmentu

  const finalAngle = rotations + fakeAngle + slice + fineOffset;

  wheel.style.transform = `rotate(${finalAngle}deg)`;

  setTimeout(() => {
    document.getElementById("winner").style.display = "flex";
  }, 6000);
}
</script>

</body>
</html>
