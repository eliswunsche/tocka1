<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kolo lásky 💘</title>
<style>
  body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: radial-gradient(circle at top, #ffb6c1, #ff69b4);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
  }

  .app {
    text-align: center;
    width: 100%;
    max-width: 360px;
    padding: 20px;
  }

  h1 {
    margin-bottom: 20px;
    font-size: 1.6rem;
  }

  .wheel-container {
    position: relative;
    width: 280px;
    height: 280px;
    margin: 0 auto 20px;
  }

  canvas {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #fff;
  }

  .pointer {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-bottom: 20px solid #fff;
  }

  button {
    background: #fff;
    color: #ff1493;
    border: none;
    padding: 14px 26px;
    font-size: 1.1rem;
    border-radius: 30px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }

  .result {
    background: #fff;
    color: #ff1493;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    max-width: 300px;
    animation: pop 0.5s ease;
  }

  @keyframes pop {
    0% { transform: scale(0.7); }
    100% { transform: scale(1); }
  }

  .confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 20;
  }

  .heart {
    position: absolute;
    color: pink;
    font-size: 20px;
    animation: fall 3s linear infinite;
  }

  @keyframes fall {
    0% { transform: translateY(-10%); opacity: 1; }
    100% { transform: translateY(110vh); opacity: 0; }
  }
</style>
</head>
<body>

<div class="app">
  <h1>Roztoč kolo lásky 💘</h1>

  <div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="wheel" width="300" height="300"></canvas>
  </div>

  <button id="spinBtn">ROZTOČIT 💞</button>
</div>

<div class="overlay" id="overlay">
  <div class="result">
    <h2>🎉 Gratuluju! 🎉</h2>
    <p><strong>Vyhrál jsi penízky na benzín ⛽❤️</strong></p>
  </div>
</div>

<div class="confetti" id="confetti"></div>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const spinBtn = document.getElementById("spinBtn");
const overlay = document.getElementById("overlay");
const confetti = document.getElementById("confetti");

const items = [
  "anál",
  "penízky na benzín",
  "striptease",
  "večeře",
  "masáž",
  "překvapko"
];

const colors = ["#ff69b4", "#ff1493"];

let rotation = 0;
const slice = (2 * Math.PI) / items.length;

function drawWheel() {
  for (let i = 0; i < items.length; i++) {
    ctx.beginPath();
    ctx.moveTo(150, 150);
    ctx.fillStyle = colors[i % 2];
    ctx.arc(
      150,
      150,
      140,
      rotation + i * slice,
      rotation + (i + 1) * slice
    );
    ctx.fill();

    ctx.save();
    ctx.translate(150, 150);
    ctx.rotate(rotation + i * slice + slice / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#fff";
    ctx.font = "16px sans-serif";
    ctx.fillText(items[i], 130, 5);
    ctx.restore();
  }
}

drawWheel();

spinBtn.addEventListener("click", () => {
  spinBtn.disabled = true;

  // CÍL: první pixely "penízky na benzín"
  const targetIndex = 1;
  const extraSpins = 6 * 2 * Math.PI;
  const offset = slice * targetIndex + 0.05; // první pixely
  const targetRotation = extraSpins - offset;

  let start = null;
  const duration = 4000;

  function animate(timestamp) {
    if (!start) start = timestamp;
    const progress = Math.min((timestamp - start) / duration, 1);
    const easeOut = 1 - Math.pow(1 - progress, 3);

    rotation = easeOut * targetRotation;
    ctx.clearRect(0, 0, 300, 300);
    drawWheel();

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      showResult();
    }
  }

  requestAnimationFrame(animate);
});

function showResult() {
  overlay.style.display = "flex";
  createConfetti();
}

function createConfetti() {
  for (let i = 0; i < 30; i++) {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "💖";
    heart.style.left = Math.random() * 100 + "%";
    heart.style.animationDelay = Math.random() * 2 + "s";
    heart.style.fontSize = 16 + Math.random() * 20 + "px";
    confetti.appendChild(heart);
  }
}
</script>

</body>
</html>
